[package]
name = "liangyijia"
version = "0.1.0"
edition = "2021"
description = "LiangYiJia - hangs screenshots, text, links and images on a line at the top of the screen"
authors = ["banqiu"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标与菜单（没有它这个应用只能进任务管理器才能退出）
# image-png：托盘用 PNG 图标
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 剪贴板：文字 / 链接 / 图片都要能挂上，arboard 的三平台实现最省事
arboard = { version = "3", features = ["image-data"] }
png = "0.17"
base64 = "0.22"

# Win32 调用用 windows-sys 而不是 windows：它只有裸函数声明，不会和 tauri 内部
# 依赖的 windows crate 版本打架（两个 crate 的 HWND 类型不同，用数值互相转换即可）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
